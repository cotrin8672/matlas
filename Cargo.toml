[package]
name = "matrust"
version = "0.3.0"
edition = "2021"
description = "Safe, idiomatic Rust bindings for MATLAB's Matrix, MEX, and MAT-file APIs"
license = "MIT"
repository = "https://github.com/cotrin8672/matrust"
documentation = "https://docs.rs/matrust"
readme = "README.md"
keywords = ["matlab", "mat-file", "mex", "ffi", "science"]
categories = ["api-bindings", "science"]
links = "matrust800"
rust-version = "1.77"
exclude = ["/.github", "/docs/RELEASING.md", "/tests"]

[dependencies]

[build-dependencies]
cc = "1"

[workspace]
members = ["tests/mex"]
default-members = ["."]
resolver = "2"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
